name: Refresh offline data packs

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: proxaid-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run update:data
      - run: npm run validate
      - name: Commit changed packs
        id: commit
        run: |
          git config user.name "proxaid-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json data/packs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh offline packs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish refreshed data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
