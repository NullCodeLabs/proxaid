name: 📡 PROXAID Weekly Radar

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  ping-topics:
    name: Ping and Aggregate Topics
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Search GitHub & Generate Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Initiating search across PROXAID topics..."
          
          # Javítva: 'fullName' használata a 'nameWithOwner' helyett
          gh search repos "topic:off-grid OR topic:mesh-networking OR topic:survival-toolkit OR topic:stealth-sos OR topic:disaster-recovery" --sort updated --limit 15 --json fullName,url,description,updatedAt > results.json
          
          echo "# 🛡️⛑️ PROXAID Weekly Radar" > report.md
          echo "Automated ping for off-grid, mesh-networking, and disaster recovery repositories. (Generated: $(date +'%Y-%m-%d'))" >> report.md
          echo "---" >> report.md
          echo "" >> report.md
          
          # Javítva: .fullName hivatkozás a jq feldolgozóban
          jq -r '.[] | "### [\(.fullName)](\(.url))\n* **Last Updated:** \(.updatedAt | fromdate | strftime("%Y-%m-%d %H:%M"))\n* **Description:** \(.description)\n---"' results.json >> report.md
          
          gh issue create --repo ${{ github.repository }} --title "📡 Weekly PROXAID Radar: $(date +'%Y-%m-%d')" --body-file report.md
